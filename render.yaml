services:
  - type: web
    name: dora-music-bot
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: PORT
        value: 8080
